name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses & Ensure Required SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -maxdepth 4 -name sdkmanager -type f 2>/dev/null | head -n 1 || command -v sdkmanager || true)
          fi
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "SDK_ROOT=$SDK_ROOT"
          echo "SDKMANAGER=${SDKMANAGER:-not_found}"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "ERROR: Android sdkmanager not found under $SDK_ROOT."
            exit 1
          fi
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null
          { yes || true; } | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36.1"
          if [ ! -d "$SDK_ROOT/platforms/android-36.1" ] || [ ! -d "$SDK_ROOT/build-tools/36.0.0" ]; then
            echo "ERROR: Required Android SDK packages (platforms/android-36.1 or build-tools/36.0.0) are missing."
            exit 1
          fi

      - name: Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper & Permissions
        run: |
          if [ ! -f ./gradlew ]; then
            echo "ERROR: gradlew not found in repository root."
            exit 1
          fi
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ERROR: gradle/wrapper/gradle-wrapper.jar is missing or empty."
            exit 1
          fi
          ./gradlew --version --no-daemon
          ./gradlew projects --no-daemon

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Clean and Build Debug APK
        run: ./gradlew clean :app:assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK Output
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -s "$APK_PATH" ]; then
            APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -name "*.apk" | head -n 1 || true)
          fi
          if [ -z "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "ERROR: Debug APK was not generated under app/build/outputs/apk/debug."
            exit 1
          fi
          echo "Generated APK: $APK_PATH"
          ls -lh "$APK_PATH"
          unzip -t "$APK_PATH" > /dev/null
          APKSIGNER=$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name "apksigner" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_PATH"
          fi
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Print Build Diagnostics on Failure
        if: failure()
        run: |
          echo "=== Java & Environment ==="
          java -version || true
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools" "$SDK_ROOT/licenses" 2>/dev/null || true
          echo "=== Recent Gradle Reports ==="
          find app/build/reports -maxdepth 3 -type f 2>/dev/null || true

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XAVION-AI-DEBUG-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30
          if-no-files-found: error
