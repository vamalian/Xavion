name: Build Android Debug APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Assemble Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK & Accept Licenses
        uses: android-actions/setup-android@v3

      - name: Set up Gradle & Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle Wrapper & Permissions
        run: |
          if [ ! -f ./gradlew ]; then
            echo "ERROR: gradlew not found in repository root."
            exit 1
          fi
          chmod +x ./gradlew
          ./gradlew --version --no-daemon

      - name: Prepare Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v -keystore debug.keystore \
                -storepass android -alias androiddebugkey -keypass android \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Locate & Verify Debug APK
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -maxdepth 2 -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Debug APK was not generated under app/build/outputs/apk/debug."
            exit 1
          fi
          echo "Generated APK: $APK_PATH"
          ls -lh "$APK_PATH"
          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Android-Debug-APK
          path: ${{ env.APK_PATH }}
          retention-days: 30
          if-no-files-found: error
